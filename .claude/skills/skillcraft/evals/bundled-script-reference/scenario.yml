name: "Guidance for referencing bundled scripts from a skill"
prompt: |
  I'm creating a skill that bundles a Python validation script. The skill
  needs to call this script regardless of what directory the user is in.
  How should I reference it?
assertions:
  - check: "Output mentions ${CLAUDE_SKILL_DIR} as the way to reference bundled scripts"
    note: "Look for the literal variable name ${CLAUDE_SKILL_DIR}, not a resolved absolute path"
  - check: "Output explains that the variable resolves to the skill's directory at load time"
  - check: "Output does not suggest hardcoding absolute paths"
    note: "Hardcoded paths like /Users/foo/.claude/skills/myskill/ are fragile and non-portable — the output should warn against this approach"
