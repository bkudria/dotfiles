prompt: |
  I need you to write an evals.yml for a discipline-type skill called
  "commit-message" that enforces conventional commit format (type(scope): description).
  The skill's key rules are: (1) every commit must use the format type(scope): description,
  (2) type must be one of feat/fix/docs/style/refactor/test/chore, (3) scope is required,
  (4) description must be lowercase and imperative mood. Don't look for the skill on
  disk — I've described it fully above. Just write the evals.yml content directly.
labels:
  name: "Write complete evals for a skill using only skillcraft guidance"
checks:
  - check: "Output produces a complete evals.yml with at least 3 scenarios including id, name, prompt, and checks for each"
  - check: "At least one scenario applies pressure to skip the convention (discipline-type pattern)"
    note: "Discipline-type skills need a scenario where the user or context pushes to skip the rule — e.g. 'just commit it quickly, don't worry about format' — to test that the skill holds firm"
  - check: "Checks in the proposed scenarios are specific and objectively verifiable, not vague quality statements"
    note: "Bad: 'output is well-formatted'. Good: 'commit message matches the pattern type(scope): description'"
