  workflows/create-phase4-author.md:
    - decision: original
      rationale: Original collaborative authoring process.
  workflows/create-phase5-validate.md:
    - decision: original
      rationale: Original validation phase using quality checklist.
  workflows/create-domain-expertise.md:
    - decision: original
      rationale: Original alternative path for broad domain skills.
  workflows/improve-standard.md:
    - decision: original
      rationale: Original 6-step audit workflow.
  workflows/improve-bulk.md:
    - decision: original
      rationale: Original bulk audit with summary table.
  workflows/update-from-sources.md:
    - decision: original
      rationale: Self-update mechanism. Not derived from any source.
  workflows/integrate-source.md:
    - decision: original
      rationale: Workflow for folding content from external sources into existing skills.
  workflows/add-provenance.md:
    - decision: original
      rationale: Workflow for adding provenance tracking to existing skills.
  # ── Scripts (all original) ──────────────────────────────────────
  scripts/scaffold.sh:
    - decision: original
      rationale: Original scaffolding script.
  scripts/quick-validate.sh:
    - decision: original
      rationale: Original structural validation script.
  scripts/post-integration-check.sh:
    - decision: original
      rationale: Post-integration content quality validation script.
  scripts/aggregate-results.sh:
    - decision: original
      rationale: Aggregates grading.json files into benchmark.json with summary statistics.
  scripts/check-upstream.sh:
    - decision: original
      rationale: Original upstream source checking script.
  # ── Eval pipeline files (original, inspired by Anthropic skill-creator) ──
  references/eval-guide.md:
    - source: anthropic-skills
      sections: [skills/skill-creator/SKILL.md]
      decision: synthesized
      rationale: >-
        Slimmed to skill-specific eval patterns only (by-skill-type tables, worked
        examples, trigger testing). Generic eval mechanics (scenario schema, assertion
        design, results interpretation) deferred to the claude-code-evals skill.
  workflows/create-phase6-eval.md:
    - source: anthropic-skills
      sections: [skills/skill-creator/SKILL.md]
      decision: synthesized
      rationale: >-
        Phase 6 workflow synthesized from Anthropic's skill-creator eval pipeline design.
        Adapted for skillcraft's sequential phase model and bash+jq toolchain.
