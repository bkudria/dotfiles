# Maps each curated file to its upstream source(s) and curation decision.
#
# Decision taxonomy:
#   kept        - Taken as-is (formatting changes only)
#   simplified  - Reduced complexity while preserving meaning
#   elided      - Intentionally excluded (rationale required)
#   altered     - Changed in meaning or approach from source
#   synthesized - Combined from multiple sources into something new
#   original    - Not derived from any upstream source
curation_decisions:
  # ── Root files ──────────────────────────────────────────────────
  SKILL.md:
    - decision: original
      rationale: Original router-pattern entry point. Not derived from any upstream source.
  # ── Reference files ──────────────────────────────────────────────
  references/official-spec.md:
    - source: official-docs
      sections: ["*"]
      decision: simplified
      rationale: >-
        Kept all spec content. Trimmed visualization walkthrough example and troubleshooting section for brevity. Added --add-dir section, skill access restriction section, updated budget description (2026-02-24).
        Added bundled skills section and ${CLAUDE_SKILL_DIR} substitution (2026-03-05).
  references/frontmatter-reference.md:
    - source: official-docs
      sections: [frontmatter-reference, string-substitutions]
      decision: kept
      rationale: >-
        Core field table and substitutions from official docs. Added user-invocable clarification (2026-02-24).
    - source: anthropic-skills
      sections: [SKILL.md#progressive-disclosure]
      decision: synthesized
      rationale: Progressive disclosure strategy guidance.
    - source: compound-engineering
      sections: [references/official-spec.md, references/skill-structure.md]
      decision: synthesized
      rationale: Added trade-off notes and common field combinations.
  references/writing-style.md:
    - source: anthropic-skills
      sections: [SKILL.md#writing-guidelines]
      decision: altered
      rationale: >-
        Expanded from terse 'use imperative/infinitive form' into comprehensive style guide with voice/tone table, formatting rules, code example requirements, and content length guidelines.
    - source: compound-engineering
      sections: [references/be-clear-and-direct.md]
      decision: synthesized
      rationale: Voice/tone rules and common mistakes table.
    - source: pcvelz-superpowers
      sections: [Code-Examples, Token-Efficiency]
      decision: synthesized
      rationale: >-
        Added "one excellent example beats many" philosophy to code examples section.
        Replaced line-based content length targets with word-based targets matching
        CSO token efficiency guidance.
  references/naming-conventions.md:
    - source: official-docs
      sections: [frontmatter-reference#name]
      decision: kept
      rationale: Name format rules (hyphen-case, 64 char max) from official spec.
    - source: compound-engineering
      sections: [SKILL.md#effective-descriptions, references/best-practices.md]
      decision: synthesized
      rationale: Description construction pattern and trigger phrase design.
    - source: pcvelz-superpowers
      sections: [CSO, Token-Efficiency, Discovery-Workflow]
      decision: synthesized
      rationale: >-
        Added Claude Search Optimization (CSO) section: description pitfall finding,
        keyword coverage strategies, word-based token efficiency targets, compression
        techniques, and discovery workflow. Descriptive naming guidance.
    - source: anthropic-skills
      sections: [skills/skill-creator/SKILL.md#description-optimization]
      decision: synthesized
      rationale: >-
        Added description trigger testing section with eval query design guidance from
        Anthropic's description optimization workflow. Kept query design principles,
        elided Python tooling (2026-03-05).
  references/skill-templates.md:
    - decision: original
      rationale: >-
        Templates are original. Inspired by compound-engineering templates but fully rewritten as generic skill-type starters (knowledge, workflow, tool, hybrid).
    - source: pcvelz-superpowers
      sections: [Skill-Types]
      decision: synthesized
      rationale: >-
        Added Technique, Pattern, and Reference skill types from writing-skills
        taxonomy. Added type comparison table. Original 4 types unchanged.
  references/interactive-tui.md:
    - decision: original
      rationale: >-
        Original content based on our interactive-tmux and gum skills.
  references/dependencies.md:
    - decision: original
      rationale: >-
        Original content. Some dependency concepts from anthropic-skills but fully rewritten.
  references/resource-usage.md:
    - source: anthropic-skills
      sections: [SKILL.md#bundled-resources]
      decision: altered
      rationale: Restructured and expanded resource type guidance.
  references/dynamic-context.md:
    - source: official-docs
      sections: [dynamic-context-injection, string-substitutions]
      decision: synthesized
      rationale: >-
        Backtick-bang syntax and string substitutions from official docs. Corrected 2026-02-24: backtick-bang works in body text, not in a context frontmatter array. Removed incorrect context-array pattern.
    - source: compound-engineering
      sections: [SKILL.md#dynamic-features]
      decision: synthesized
      rationale: Use case patterns and best practices.
  references/anti-patterns.md:
    - source: compound-engineering
      sections: [SKILL.md#anti-patterns, references/best-practices.md]
      decision: altered
      rationale: >-
        Expanded from brief list to named anti-patterns with before/after fixes.
    - source: anthropic-plugin
      sections: [references/eval-mode.md]
      decision: synthesized
      rationale: Iteration patterns for skill quality.
    - source: pcvelz-superpowers
      sections: [Anti-Patterns, CSO]
      decision: synthesized
      rationale: >-
        Added 5 new anti-patterns (Narrative Example, Multi-Language Dilution,
        Workflow Summary Description, Code in Flowcharts, Generic Labels).
        Reorganized all 15 into 4 categories (Structural, Content, Naming &
        Discovery, Examples & Formatting).
  references/bulletproofing.md:
    - source: pcvelz-superpowers
      sections: [Bulletproofing, Persuasion-Principles, RED-GREEN-REFACTOR]
      decision: synthesized
      rationale: >-
        Synthesized from writing-skills rationalization resistance techniques,
        persuasion principles (Cialdini 2021, Meincke 2025), loophole closing
        patterns, and red flags list approach. Adapted to skillcraft's structure.
  references/common-fixes.md:
    - decision: original
      rationale: Concrete fix cookbook built from checklist failure patterns.
  references/quality-checklist.md:
    - source: compound-engineering
      sections: [SKILL.md#audit-checklist]
      decision: altered
      rationale: Expanded from ~10 items to 32 checks across 6 categories.
    - source: anthropic-plugin
      sections: [references/schemas.md]
      decision: synthesized
      rationale: Added advanced feature checks (A1-A5).
    - source: pcvelz-superpowers
      sections: [Skill-Creation-Checklist]
      decision: synthesized
      rationale: >-
        Added T1-T5 TDD Compliance category (baseline tested, rationalizations
        captured, compliance verified, loopholes closed, skill type testing).
        Total now 42 checks across 8 categories (added E1-E5 eval pipeline category).
  references/source-integration.md:
    - decision: original
      rationale: Templates and frameworks for source integration workflow.
  references/router-pattern.md:
    - decision: original
      rationale: Original architecture guidance for when/how to upgrade to router pattern.
  references/testing-guide.md:
    - decision: original
      rationale: Original testing framework covering 6 testing areas.
    - source: pcvelz-superpowers
      sections: [TDD-Mapping, Iron-Law, Testing-All-Skill-Types, Common-Rationalizations]
      decision: synthesized
      rationale: >-
        Added TDD Iron Law, testing-by-skill-type
        (discipline/technique/pattern/reference), and rationalization table. Original
        6 testing areas preserved intact.
  # ── Workflow files (all original) ────────────────────────────────
  workflows/create-phase1-discovery.md:
    - decision: original
      rationale: Original interview-driven discovery process.
  workflows/create-phase2-design.md:
    - decision: original
      rationale: Original design phase with type/feature selection.
  workflows/create-phase3-scaffold.md:
    - decision: original
