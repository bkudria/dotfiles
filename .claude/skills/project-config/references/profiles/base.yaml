# Base profile — default standards and metadata for all projects
#
# Use in project.yaml:
#   profiles: [base]
#
# Override any setting by declaring it explicitly in project.yaml.
# Metadata defaults go under defaults:, standard configs under standards:.

# Metadata defaults — omit these from project.yaml when they match
defaults:
  status: experimental
  visibility: private

standards:
  readme:
    required: true
    references: [goals, spec]

  gitignore:
    required: true

  license:
    required: true
    spdx: MIT

  tests:
    required: true

  claude-md:
    required: true

  goals:
    required: true

  spec:
    required: true

  linter:
    required: true

  coverage:
    required: true
