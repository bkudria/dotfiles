prompt: |
  I want to create a new TypeScript CLI project called "taskflow".
  It's a task automation tool. Use the base profile as a starting point.

  Generate the project.yaml file.
labels:
  name: "Scaffold generates minimal project.yaml under the new two-key schema"
assertions:
  - check: "The generated project.yaml includes 'profiles: [base]' (array syntax, not singular 'profile:')"
  - check: "The generated project.yaml does NOT contain any metadata fields — no `name`, `description`, `language`, `status`, `visibility`, or `repo` keys"
    note: "The new schema rejects all metadata; standards inspect the project itself rather than reading declarations"
  - check: "The generated project.yaml does NOT contain a `standards:` block"
    note: "Standards are not configurable per-project; they live as self-contained YAMLs under profiles/"
  - check: "The generated project.yaml does NOT contain `tests.framework`, `tests.directory`, `claude-md.sections`, or any other per-standard parameters"
    note: "The new architecture is intentionally language- and tool-agnostic — there are no parameterized standards"
  - check: "If a `disabled:` block is present, every entry has a non-empty reason string and a key of the form `<profile>/<basename>`"
