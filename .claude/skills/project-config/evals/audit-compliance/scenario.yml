prompt: |
  I have a Ruby project at ~/code/my-gem with this project.yaml:

  ```yaml
  profiles: [base, public]
  ```

  The project currently has: README.md (with just a title, no Installation/Usage sections), LICENSE (MIT), spec/ directory with spec_helper.rb, .rubocop.yml, and .github/workflows/test.yml. It's missing CLAUDE.md, GOALS.md, and CONTRIBUTING.md.

  Audit the project against its standards.
labels:
  name: "Audit mode produces compliance table and remediation plan"
assertions:
  - check: "Output contains a markdown table listing each standard with its compliance status (one of PASS, FAIL, or SUGG — never WARN, MANUAL, SKIP, or DISABLED)"
  - check: "base/license, base/tests, base/linter, and public/ci are marked as PASS (their underlying files exist)"
  - check: "base/claude-md and base/goals are marked as FAIL (the files are missing and these standards are required)"
  - check: "public/contributing is marked as FAIL (CONTRIBUTING.md is missing and the public profile requires it)"
  - check: "public/readme-sections is marked as FAIL or SUGG (README has no Installation/Usage headings) — the row for the section check is separate from the base/readme row"
  - check: "Output includes a prioritized remediation plan listing the most impactful fixes first"
