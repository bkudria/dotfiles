prompt: |
  Audit the standards for a TypeScript project at ~/code/example-ts.
  It uses `profiles: [base]`.
  All infrastructure files exist: README.md, .gitignore, LICENSE (MIT),
  tests/ directory with vitest.config.ts, CLAUDE.md, GOALS.md, SPEC.md,
  eslint.config.js, and vitest.config.ts has coverage configured with
  thresholds.
  Run the full audit.
labels:
  name: "Audit includes runtime-verification standards from base profile"
assertions:
  - check: "Output includes a base/linter-run row with a verdict that reflects actually running the linter (e.g., issue count) — not just confirming the config exists"
  - check: "Output includes a base/tests-run row with a verdict that reflects actually running the tests (e.g., pass/fail counts) — not just confirming a test directory exists"
  - check: "Output includes a base/coverage-run row with a verdict that reflects actually running coverage (e.g., a measured percentage) — not just confirming coverage is configured"
  - check: "The deterministic infrastructure rows (base/tests, base/linter, base/coverage) appear separately from the *-run rows — both kinds of standards run, neither replaces the other"
    note: "Each YAML in profiles/base/ is its own standard; the audit lists every one"
