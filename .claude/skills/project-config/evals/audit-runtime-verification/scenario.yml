prompt: |
  Audit the standards for a TypeScript project at ~/code/example-ts.
  It uses profiles: [base] with tests framework: vitest and directory: tests.
  All infrastructure files exist: README.md (references GOALS.md and SPEC.md),
  .gitignore, LICENSE (MIT), tests/ directory with vitest.config.ts,
  CLAUDE.md, GOALS.md, SPEC.md, eslint.config.js,
  and vitest.config.ts has coverage configured with thresholds.
  Run the full audit.
labels:
  name: "Audit includes runtime verification — runs linter, tests, and coverage"
assertions:
  - check: "Output includes a row for linter runtime results (e.g. linter.run) showing whether the linter passed or failed, not just that a linter config file exists"
  - check: "Output includes a row for test suite runtime results (e.g. tests.run) showing pass/fail counts from actually running the tests, not just that a test directory exists"
  - check: "Output includes a row for coverage runtime results (e.g. coverage.run) showing an actual coverage percentage from running coverage, not just that coverage is configured"
  - check: "The infrastructure check rows (tests, linter, coverage) still appear separately from the runtime rows — runtime verification supplements infrastructure checks, it does not replace them"
