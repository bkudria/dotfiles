prompt: |
  I have a Bun-based JavaScript project at ~/code/my-cli with this project.yaml:

  ```yaml
  profiles: [base]

  required:
    - base/lockfile
  ```

  The project has package.json, README.md, LICENSE, .gitignore, CLAUDE.md, GOALS.md, SPEC.md, vitest.config.ts, and a tests/ directory. It has NO lockfile committed (no bun.lock, no bun.lockb, no package-lock.json, no yarn.lock, no pnpm-lock.yaml).

  Audit the project against its standards.
labels:
  name: "Required-override upgrades a SUGG standard to FAIL"
assertions:
  - check: "base/lockfile is reported as FAIL (not SUGG), because the project's project.yaml lists it under `required:` even though the underlying standard YAML declares `required: false`"
    note: "The `required:` list in project.yaml upgrades severity from SUGG to FAIL for this project only"
  - check: "Output contains a markdown table listing each non-PASS standard with its compliance status"
  - check: "The audit pass/fail signal reflects FAIL (e.g., a fix-plan section appears, or the audit is summarized as failing)"
    note: "Because base/lockfile is treated as required for this project, the audit must not present as passing"
