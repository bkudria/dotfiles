prompt: |
  I have a Bun-based JavaScript project at ~/code/my-cli with this project.yaml:

  ```yaml
  profiles: [base]
  ```

  The project meets every standard the `base` profile activates: it has README.md, LICENSE, .gitignore, CLAUDE.md, GOALS.md, SPEC.md, vitest.config.ts, a tests/ directory, package.json, AND a committed bun.lock. Every check passes — there are no FAIL rows and no SUGG rows.

  Audit the project against its standards.
labels:
  name: "All-pass audit suggests `required:` lock-in for SUGG-style standards"
assertions:
  - check: "Output contains a markdown table header (with Standard / Status / Detail columns) followed by a blank line and a count line ending in '0 FAIL, 0 SUGG'"
    note: "Render is verbatim regardless of all-pass; the empty table + count line still appear"
  - check: "Output contains a 'lock-in' suggestion line — a sentence about enforcing the standards going forward by adding to project.yaml"
    note: "Triggered specifically by zero-FAIL, zero-SUGG, with at least one PASSing SUGG-style standard not yet in `required:`"
  - check: "Below that line is a YAML block beginning with `required:` and one or more `  - <profile>/<basename>` entries — at minimum, `base/lockfile` is listed, since it's a SUGG-style standard whose check passes (lockfile present) and is not in the project's `required:` list"
    note: "Eligible = PASSing AND its standard YAML declares `required: false` AND not already in the project's `required:` list"
  - check: "The output does NOT include a fix-plan section, since there are no FAIL or SUGG rows to remediate"
    note: "Step 4 of the audit workflow only emits a plan when at least one FAIL or SUGG row exists"
