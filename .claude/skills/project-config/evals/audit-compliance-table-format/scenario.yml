prompt: |
  Check the standards compliance for this project. The project has a project.yaml
  declaring `profiles: [base]`. Some standards pass (base/gitignore, base/license,
  base/tests, base/claude-md) and some fail (no README.md, no GOALS.md). Run
  the audit and show results.
labels:
  name: "Audit output follows required compliance table format"
assertions:
  - check: "Output contains a markdown table with columns named Standard, Status, and Detail"
    note: "The exact column names are specified in workflows/audit.md"
  - check: "Status values use exactly PASS, FAIL, or SUGG — not other words like 'OK', 'WARN', 'MANUAL', 'SKIP', 'DISABLED', 'Missing', or 'Yes/No'"
    note: "These exact status words are required by the new architecture; WARN/MANUAL/SKIP/DISABLED are explicitly forbidden"
  - check: "Each row's first column is `<profile>/<basename>` (e.g., `base/readme`, not just `readme`)"
    note: "Standard identity in the audit is the profile/basename pair, since profiles do not merge"
  - check: "Output includes a prioritized remediation plan section below the compliance table that ranks fixes by impact"
    note: "The remediation plan must explain WHY each fix matters, not just list what to do"
