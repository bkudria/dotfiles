prompt: |
  Audit standards for a Python project at ~/code/example-py. The project.yaml declares
  `profiles: [base]`.
  The project has README.md, .gitignore, LICENSE (MIT), CLAUDE.md, GOALS.md, SPEC.md.
  But it has NO test directory, NO linter config, and NO coverage config.
  Run the audit.
labels:
  name: "Runtime-verification standards report unmet when there is no infrastructure to run"
assertions:
  - check: "base/tests is marked FAIL because no test directory exists"
  - check: "base/linter is marked FAIL because no linter is configured"
  - check: "base/coverage is marked FAIL because no coverage threshold is configured"
  - check: "base/tests-run, base/linter-run, and base/coverage-run rows DO appear in the table — they are independent prompt-based standards that always run, not conditional on the deterministic infrastructure rows"
    note: "Under the new architecture there is no implicit skip — each standard YAML resolves to PASS/FAIL/SUGG independently"
  - check: "base/tests-run, base/linter-run, and base/coverage-run are each marked FAIL with a Detail explaining there is nothing to run"
    note: "These standards are required: true; when the verifier cannot find tools, the standard is unmet and FAIL"
