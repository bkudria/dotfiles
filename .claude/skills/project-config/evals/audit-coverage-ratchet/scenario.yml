prompt: |
  Audit standards for a TypeScript project at ~/code/example-ts. The project.yaml
  declares `profiles: [base]`. All infrastructure files exist. The vitest.config.ts
  has a coverage section that enables coverage reporting but does NOT configure any
  thresholds or minimum coverage requirements — there is no coverage ratchet.

  Run the audit.
labels:
  name: "base/coverage standard requires a ratchet to be configured"
assertions:
  - check: "The base/coverage row is marked FAIL because coverage is configured but no ratchet/threshold is set"
    note: "base/coverage is a prompt-based standard whose verifier checks that some threshold is committed; coverage configured without a ratchet is FAIL when required: true"
  - check: "The base/coverage row's Detail explains that a coverage ratchet or minimum threshold is missing"
  - check: "The audit makes no reference to a `coverage.ratchet:` field in project.yaml — the new schema has no per-standard parameters"
    note: "The ratchet expectation is encoded inside the standard YAML itself, not as a project.yaml knob"
