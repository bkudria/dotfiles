required: false
description: The project runs dedicated static-analysis tooling that produces complexity/smell metrics.
notes: |
  This standard requires tooling whose primary purpose is producing
  complexity, smell, or maintainability metrics, distinct from
  `base/linter`/`linter-run` (style/syntax) and `base/formatter`
  (layout). Those neighboring standards already credit style linters in
  their own right; this standard requires a SEPARATE, DEDICATED
  complexity/smell analyzer.

  A style linter that happens to have complexity rules turned on does
  NOT qualify. The signal a dedicated analyzer produces — a
  maintainability score, a churn report, a duplication map, a
  per-method cyclomatic-complexity histogram — is qualitatively
  different from "lint passes / fails"; treating a single complexity
  rule embedded in a style linter as equivalent collapses the
  distinction the standard exists to enforce.

  Combined check: tooling is configured AND the run is clean. If the
  tool supports a quality threshold or gate (e.g. a minimum
  maintainability score, a fail-under percentage), a threshold must
  be configured — running without one reports smells but cannot fail
  the build, which is no signal at all.

  Default severity is SUGG because static analysis is one of several
  valid quality approaches. Projects that bake it into their default
  build should pin this to FAIL via `required: [base/code-quality]`.
  Projects that intentionally rely on style linters alone can disable
  it via the `disabled:` map with a reason.
check:
  prompt: |
    Verify that the project at $PROJECT_ROOT runs DEDICATED static-analysis
    tooling that produces complexity, smell, or maintainability metrics —
    distinct from style linters, formatters, and test runners.

    HARD EXCLUSION: a style linter with complexity rules enabled does
    NOT satisfy this standard, even if those rules emit complexity
    numbers. The reason is that `base/linter` and `base/linter-run`
    already credit the project's style linter; this standard requires a
    SEPARATE tool that is invoked independently, has its own
    configuration file or task entry, and whose primary purpose is
    complexity/smell analysis. To qualify, the tool must satisfy ALL of:

    - It is invoked as its own command (not as a flag or rule embedded
      in the same invocation as the project's style linter).
    - It has its own dedicated configuration (a config file, a task
      entry, a CI step) distinct from the style linter's configuration.
    - Its primary, advertised purpose is complexity/smell/maintainability
      analysis, not style or syntax enforcement. A tool that primarily
      enforces style and incidentally exposes complexity rules does
      not become a complexity analyzer just because those rules are
      enabled.

    Detect the project's language(s) from manifest and root files,
    then verify:

    1. A dedicated complexity/smell/maintainability tool is configured
       — its own config file, its own dependency entry, and its own
       Rakefile/Makefile/package.json/CI invocation that runs it
       separately from any style linter. If no such dedicated tool is
       configured, report unmet.
    2. If the tool supports a quality threshold or gate, confirm one
       is configured. A threshold-capable tool running without one is
       unmet (with a nudge to set a threshold).
    3. Execute the tooling without modifying the working tree (no
       baseline regeneration, no auto-fix). The standard meets iff
       the tool exits 0 AND any configured threshold is satisfied.

    Report met (with the tool name, threshold value if any, and a
    one-line result summary like "score 92.4 ≥ 90.0") or unmet (with
    the reason — not configured as a dedicated tool, only style-linter
    complexity rules present, no threshold set on a threshold-capable
    tool, threshold breached, or runtime failure summary).
