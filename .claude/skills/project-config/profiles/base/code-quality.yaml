required: false
description: The project runs static-analysis tooling that produces complexity/smell metrics.
notes: |
  Static-analysis tooling (RubyCritic, Reek, SonarQube, Code Climate,
  Codacy, ESLint complexity rules, Pylint design checkers, golangci-lint
  with gocyclo/gocognit, Detekt, etc.) measures complexity and code
  smells. Distinct from `base/linter`/`linter-run` (style/syntax) and
  `base/formatter` (layout).

  Combined check: tooling is configured AND the run is clean. If the
  tool supports a quality threshold (RubyCritic `--minimum-score`,
  SonarQube quality gate, Code Climate maintainability threshold,
  Pylint `--fail-under`, etc.), a threshold must be configured —
  running without one reports smells but cannot fail the build, which
  is no signal at all.

  Default severity is SUGG because static analysis is one of several
  valid quality approaches. Projects that bake it into their default
  build (e.g., a `rake critic:top` task with a minimum score) should
  pin this to FAIL via `required: [base/code-quality]`. Projects that
  intentionally rely on style linters alone can disable it via the
  `disabled:` map with a reason.
check:
  prompt: |
    Verify that the project at $PROJECT_ROOT runs static-analysis
    tooling that produces complexity/smell metrics — distinct from
    style linters (Rubocop/ESLint/Pylint style rules), formatters,
    and test runners. Examples by ecosystem: RubyCritic, Reek, Flog,
    Flay (Ruby); SonarQube/SonarCloud, Code Climate, Codacy
    (multi-language); ESLint with `complexity`/`max-depth`/`max-lines`
    rules, plato (JavaScript/TypeScript); Pylint design checkers,
    Radon, Wily, mccabe (Python); golangci-lint with
    gocyclo/gocognit/funlen, staticcheck (Go); PHPStan rule levels,
    Psalm, PHPMD (PHP); SwiftLint cyclomatic_complexity (Swift);
    Detekt, Qodana (Kotlin); Clippy `cognitive_complexity` (Rust).

    Detect the project's language(s) from manifest and root files,
    then verify:

    1. The tooling is configured — a config file, dependency entry,
       or Rakefile/Makefile/package.json/CI hook that invokes it.
       If nothing is configured, report unmet.
    2. If the tool supports a quality threshold or gate, confirm
       one is configured. A threshold-capable tool running without
       one is unmet (with a nudge to set a threshold).
    3. Execute the tooling without modifying the working tree (no
       baseline regeneration, no auto-fix). The standard meets iff
       the tool exits 0 AND any configured threshold is satisfied.

    Report met (with the tool name, threshold value if any, and a
    one-line result summary like "score 92.4 ≥ 90.0") or unmet
    (with the reason — not configured, no threshold set on a
    threshold-capable tool, threshold breached, or runtime failure
    summary).
