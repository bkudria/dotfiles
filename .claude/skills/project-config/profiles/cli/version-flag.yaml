required: true
description: The CLI prints its version string on `--version`.
notes: |
  Every CLI should answer `--version` with at least its program
  name and version. The pairing of `-h`/`--help` and `--version`
  is the baseline CLI interaction; GNU coding standards
  additionally suggest copyright and license. A short `-V` flag
  is conventional but contested (some CLIs use `-v` for verbose);
  presence of the long form is the bar.

  The version string should match the project's package manifest
  (Cargo.toml, pyproject.toml, package.json, gemspec, etc.) so users
  and ops tooling can correlate output with the installed release.
  Hard-coded drift between manifest and `--version` output is the
  most common failure mode and what this standard primarily catches.

  Required because every CLI hit in CI, support tickets, or version
  pinning needs a reliable way to ask "what version is this?".
check:
  prompt: |
    Verify that the CLI at $PROJECT_ROOT prints a version string on
    `--version`. Locate the entry point (manifest `bin` field,
    executable in `bin/` or `exe/`, language-conventional main
    file). If invocation is cheap (script entry point, prebuilt
    artifact, language interpreter available) run `<cli> --version`
    and inspect the output; otherwise inspect source for the flag
    handler. Confirm the version printed matches the version
    declared in the package manifest. A `-V` short flag is welcome
    but not required. Report met (with the entry point, the version
    string emitted, and whether it was observed via execution or
    inferred from source) or unmet (with the gap — no flag handler,
    no version string, or a mismatch with the manifest version).
