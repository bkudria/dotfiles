required: false
description: Deprecated flags or subcommands print a stderr warning that names the replacement and migration path.
notes: |
  Keep changes additive — add a new flag rather than changing an
  existing flag's meaning. Warn before non-additive changes, in
  the program itself, before users hit them. Deprecation warnings
  must include how to update usage today to be future-safe.

  Trivially met for new projects with no deprecated paths. As soon
  as a flag/subcommand is removed or renamed, the standard requires
  the old form to keep working with a stderr warning that points
  to the new form for at least one release cycle (typically the
  remainder of the current major version).

  The check correlates the CHANGELOG with current code: if the
  CHANGELOG says "deprecated `--foo` in favor of `--bar`", then
  the current code must still accept `--foo` and emit a warning
  that mentions `--bar`.

  Default severity is SUGG. Projects with established users (and
  therefore real deprecation cost) should pin to FAIL.
check:
  prompt: |
    Verify that deprecated flags or subcommands in the CLI at
    $PROJECT_ROOT print a stderr warning that names the
    replacement. Detect deprecations:
    - search source for deprecation markers and warning calls —
      annotations like `deprecated`/`@deprecated`/`#[deprecated]`,
      calls to whatever deprecation-warning API the language
      provides, or `"DEPRECATED:"` string literals printed to
      stderr;
    - cross-reference with the CHANGELOG for any flag/subcommand
      renames or removals in recent versions.

    The standard meets if every deprecation listed in the CHANGELOG
    (within the most recent two minor versions or one major) is
    still accepted by the current code AND emits a warning that
    names the replacement. Trivially met if no deprecations are
    recorded. Report met (with the deprecation inventory and a
    quoted warning per item) or unmet (listing the deprecations
    whose old form was removed without a warning bridge, or whose
    warning omits the migration path).
