required: true
description: The CLI exits 0 on success and non-zero on failure.
notes: |
  CLIs should return a zero exit code on success and a non-zero
  code on failure. This is the bedrock of CLI composability —
  pipelines, `&&` chains, CI gates, and `set -e` shell scripts
  all depend on it. Use of additional exit codes for
  distinguishing failure modes (sysexits.h conventions, language-
  specific code maps) is encouraged but not required.

  Common failure modes that should produce non-zero: invalid args,
  unreadable files, network errors, validation failures, unhandled
  exceptions. The most common drift is a `try/except` or
  `rescue`/`recover` block that swallows the error, prints it, and
  falls through to implicit exit 0 — masking real failure from
  callers.

  Required because a CLI that exits 0 on failure cannot be safely
  composed with other tools or used in CI.
check:
  prompt: |
    Verify that the CLI at $PROJECT_ROOT exits 0 on success and
    non-zero on failure. Inspect the entry point and major error
    paths in source for explicit non-zero exits (whatever the
    language uses to set the process exit code, e.g., `exit(1)`
    and equivalents) or raised-and-uncaught exceptions propagated
    to the runtime. Look especially for catch/except/
    rescue/recover blocks that swallow errors and fall through with
    implicit exit 0. If the CLI ships tests asserting exit codes
    (CLI snapshot tests, integration tests that check `$?`), prefer
    those as evidence — they are the strongest signal. Report met
    (with the patterns observed and any test coverage of error
    exits) or unmet (with the specific paths that swallow errors
    or otherwise return 0 on failure).
