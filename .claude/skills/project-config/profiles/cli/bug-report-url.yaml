required: false
description: Unhandled or unexpected errors surface a URL or command for filing a bug.
notes: |
  For unexpected or unexplainable errors, provide debug info,
  traceback, AND bug-submission instructions. Make bug reports
  effortless: provide a URL that pre-populates info. A pre-
  populated GitHub new-issue URL with version, OS, and a
  redacted error context as query parameters is the gold standard,
  but the bar here is the URL itself: an unhandled exception path
  that prints "report this at https://github.com/<org>/<repo>/issues"
  is enough.

  The mechanism is typically a global panic/exception handler, a
  top-level rescue/recover/catch, or an error-rendering helper.
  Pre-population is a quality bonus.

  Default severity is SUGG because some CLIs intentionally route
  bug reports through a different channel (Slack, email, internal
  tracker, dedicated `<cli> bug-report` subcommand) and don't
  surface a URL inline.
check:
  prompt: |
    Verify that unhandled or unexpected errors in the CLI at
    $PROJECT_ROOT surface a URL or command for filing a bug.
    Inspect the global panic/exception handler, top-level
    rescue/recover/catch path, or error-rendering helper for a
    string referencing the project's issue tracker, support email,
    or `<cli> bug-report` subcommand. Pre-populated URLs (with
    version/OS query parameters) are stronger evidence but not
    required. Report met (with the call site and a quoted snippet
    of the URL/command) or unmet (with the location of the panic/
    exception handler that omits any reporting guidance).
