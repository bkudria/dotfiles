required: true
description: No flags accept secret material as a literal value.
notes: |
  Don't read secrets from flag values. Accept secrets via files
  (e.g., `--password-file`) or stdin instead. Flag values appear
  in process listings (`ps auxf`), shell history, container
  inspection (`docker inspect`), systemd journal, and CI logs. A
  `--password VAL` flag is a secret-exposure vector waiting to
  fire.

  Acceptable secret-input mechanisms:
  - `--password-file <path>` (read from a file with restricted
    permissions),
  - `--password-stdin` (read from stdin),
  - env var (with the caveat that env vars also leak via process
    state, but at least don't show up in shell history or
    `ps auxf`),
  - OS keychain integration (Keychain Access, Credential Manager,
    libsecret).

  Required because exposing secrets via process state is a
  security defect, not a UX preference. CLIs that legitimately
  need a literal-value flag for backwards compatibility (curl
  `--user`, mysql `-p`) typically also document the alternatives
  prominently and warn about the literal flag — that pattern can
  meet the standard.
check:
  prompt: |
    Verify that the CLI at $PROJECT_ROOT does not accept secrets
    as literal flag values. Inspect the flag declarations
    (however the project registers flags in source) for flag
    names suggesting secret material:
    `--password`, `--passwd`, `--token`, `--api-key`, `--apikey`,
    `--secret`, `--key` (when used for auth), `--auth-token`,
    `--access-key`, `--client-secret`, `--bearer`, `--credentials`
    (when scalar, not a file path).

    For each, confirm whether it takes a literal value or a file
    path / stdin pointer. The standard meets if no such flag
    accepts a literal secret, OR each such flag has a documented
    `--<flag>-file` / `--<flag>-stdin` companion AND the README
    or `--help` warns about the literal-value flag. Report met
    (with the flag inventory and the safe alternatives in place)
    or unmet (listing the literal-value secret flags detected).
