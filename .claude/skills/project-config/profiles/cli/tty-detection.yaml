required: false
description: The CLI inspects whether stdout (and ideally stderr) is a TTY to gate color, animation, and paging.
notes: |
  clig.dev O2-O3: "Detect TTY to choose human vs machine output
  mode. Check stdout and stderr TTY status independently." Without
  TTY awareness, piping to `cat` or redirecting to a file produces
  walls of ANSI escapes, broken progress bars, and stuck spinners.

  Look for `isatty(stdout)` / `os.isatty(...)` /
  `process.stdout.isTTY` / `IsTerminal(os.Stdout.Fd())` /
  `std::io::IsTerminal::is_terminal()` / `STDOUT.tty?` or
  equivalent. Cross-checking stderr separately is a finer point
  (some CLIs want color on stderr even when stdout is piped); the
  bar here is at least one TTY check that gates output behaviour.

  Default severity is SUGG because output-only filter tools (jq,
  grep) often skip explicit TTY checks and still behave well with
  pipes; the failure mode is most acute for CLIs with color,
  animation, or paging. Color-using CLIs should pin to FAIL.
check:
  prompt: |
    Verify that the CLI at $PROJECT_ROOT inspects whether stdout
    (and ideally stderr) is a TTY and adapts output accordingly.
    Inspect source for TTY-detection calls (`isatty`, `IsTerminal`,
    `process.stdout.isTTY`, `STDOUT.tty?`, `os.isatty`, etc.)
    gating color, progress indicators, animations, or pager
    invocation. A single gate that disables color when stdout is
    not a TTY suffices to meet; multiple independent gates (color
    separate from progress separate from paging) are stronger
    evidence. Report met (with the location(s) of the TTY check
    and what behaviour it gates) or unmet (noting whether the CLI
    emits color or animation that would benefit from a TTY guard,
    or whether the CLI's output is plain enough that a guard is
    unnecessary).
