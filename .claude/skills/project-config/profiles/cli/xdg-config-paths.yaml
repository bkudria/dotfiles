required: false
description: User-level configuration is stored under `$XDG_CONFIG_HOME` (default `~/.config/<app>/`).
notes: |
  clig.dev C5: "Follow the XDG-spec — store configs under
  `~/.config` (or `$XDG_CONFIG_HOME`)." Dropping a `~/.<app>rc`
  file or a `~/.<app>/` directory in HOME is the older (pre-XDG)
  convention; the modern expectation is
  `~/.config/<app>/config.<ext>` with `$XDG_CONFIG_HOME` override
  support.

  Trivially met for CLIs without user-level config (per-project-only
  config files, env-var-only config, no config at all). Otherwise:
  the CLI should read `$XDG_CONFIG_HOME` if set, fall back to
  `~/.config/<app>/`, and ideally migrate any legacy `~/.<app>` on
  first access for backwards compat (the migration is optional for
  new CLIs).

  Default severity is SUGG. macOS-only or Windows-aware CLIs may
  legitimately use platform-native config dirs (`~/Library/
  Application Support/<app>` on macOS, `%APPDATA%\<app>` on
  Windows); the verifier should accept those.
check:
  prompt: |
    Verify that user-level configuration in the CLI at $PROJECT_ROOT
    is stored under `$XDG_CONFIG_HOME` (default `~/.config/<app>/`)
    or platform-native equivalents (`~/Library/Application Support/
    <app>` on macOS, `%APPDATA%\<app>` on Windows). Inspect source
    for config-path resolution: look for `XDG_CONFIG_HOME` reads,
    `~/.config/` paths, `dirs::config_dir`, `os.path.expanduser
    ('~/.config/...')`, `path.join(homedir, '.config', ...)`,
    `xdg.BaseDirectory.save_config_path`, etc. If the CLI has no
    user-level config (only project-level and/or env-only), report
    met with that fact. The standard is unmet if the CLI writes to
    `~/.<app>rc`, `~/.<app>/`, or other pre-XDG HOME-direct paths
    without an XDG fallback. Report met (with the path resolution
    mechanism and the resolved default) or unmet (with the legacy
    path used and a suggestion to adopt XDG).
