required: false
description: Long-running operations emit progress feedback (spinner, progress bar, or status updates) when stdout is a TTY.
notes: |
  Long-running operations should be responsive: output something
  within ~100ms, show progress (spinner / progress bar / status)
  for operations that may take more than a second or two, and
  progress indicators should animate or show ETA — no static
  "stuck" appearance. A silent CLI for >2 seconds reads as hung.

  Trivially met if no operation in the CLI takes more than a
  second on typical input. Otherwise the long paths (downloads,
  builds, index/cache builds, batch operations) need a visible
  signal — ideally TTY-gated so it doesn't pollute CI logs (no
  animations off-TTY).

  Default severity is SUGG. CLIs that orchestrate slow remote
  operations (deploys, large queries, DB migrations, package
  installs) should pin to FAIL.
check:
  prompt: |
    Verify that long-running operations in the CLI at $PROJECT_ROOT
    emit progress feedback. Identify operations that may exceed ~1
    second: network downloads/uploads, build/compile steps, batch
    file operations, indexing, queries with large result sets,
    migrations. If no such operations exist, report met with that
    fact. Otherwise, inspect source for progress-indicator usage
    (whatever spinner, progress-bar, or status-line library or
    API the project uses), explicit status messages between
    steps, or streaming output as work proceeds. Progress should be TTY-gated so it does not
    spam CI logs. Report met (with the long operations identified,
    the indicator type, and a TTY-gating note) or unmet (listing
    operations that run silently for extended periods).
