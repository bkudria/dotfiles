required: false
description: Network calls have explicit, sensible default timeouts.
notes: |
  Sensible default timeouts on network operations are essential.
  Default HTTP client timeouts in many languages are effectively
  unbounded — calling out to a slow or unreachable host with no
  timeout configured can hang indefinitely.

  A CLI that hangs forever on a slow proxy is broken in CI and on
  flaky networks. Acceptable: a default connect+read timeout in
  the low seconds-to-tens-of-seconds range, configurable via flag
  or env. Long-running operations (downloads, streams) should use
  streaming reads with per-chunk timeouts rather than a single
  whole-request cap.

  Default severity is SUGG. CLIs that are heavy network clients
  (deploy tools, API clients, package managers) should pin to FAIL
  — a hang in a release pipeline is expensive.
check:
  prompt: |
    Verify that network calls in the CLI at $PROJECT_ROOT have
    explicit default timeouts. First detect whether the CLI does
    network I/O by inspecting source for HTTP-client construction
    or invocation — whatever language-native or library API the
    project uses for network requests. If no network I/O is
    present, report met with that fact. Otherwise, inspect
    the HTTP client construction for explicit timeout config
    (request timeout, connect timeout, read timeout). The standard
    meets if every HTTP client created has at least one explicit
    timeout in the seconds-to-tens-of-seconds range; default-`None`
    or default-zero (unbounded) constructions are unmet. Report
    met (with the client(s) and the timeout values observed) or
    unmet (listing the call sites that construct unbounded clients).
