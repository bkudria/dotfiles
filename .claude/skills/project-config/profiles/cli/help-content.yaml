required: false
description: "`--help` (top-level and per-subcommand) shows program description, example invocations, complete flag descriptions, and a docs/support URL."
notes: |
  Four staples for help output: a one-line program description,
  example invocations (lead with examples), flag descriptions
  (unless many — in which case point to a longer reference),
  and a link to web documentation, support, or the source
  repository.

  Most modern CLI libraries surface description, examples, and the
  flag table by default given decent metadata; the URL is the most
  commonly missed item. Format flexibility is intentional — a single
  concise example block at the top satisfies the bar; a sprawling
  cheat sheet is fine too.

  This standard applies to both the top-level `--help` and per-
  subcommand help. Every non-trivial subcommand (one declaring
  flags or arguments) should have at least one concrete example in
  its own help output; top-level examples don't substitute for
  subcommand-specific ones, because users typing
  `<cli> deploy --help` are looking for deploy-specific guidance.

  Every declared flag should have a non-empty description. A flag
  table without descriptions is functionally useless — it tells
  the reader the flag exists but nothing about when or how to use
  it. Both top-level and per-subcommand flag tables are checked.

  Default severity is SUGG because layout choices vary widely and
  some CLIs intentionally minimise help output. Projects that want
  enforced help quality should pin via `required: [cli/help-content]`.
check:
  prompt: |
    Verify that the CLI at $PROJECT_ROOT emits help output meeting
    all of the following.

    For the top-level `--help`:
    (1) a one-line program description,
    (2) at least one concrete example invocation,
    (3) descriptions of available flags (every declared flag has a
        non-empty description),
    (4) a URL to web documentation, support, or the source repo.

    For each non-trivial subcommand (one declaring flags or
    arguments), its `--help` output should also have:
    (5) at least one concrete example invocation specific to that
        subcommand,
    (6) every declared flag with a non-empty description.

    Run `<cli> --help` and `<cli> <subcommand> --help` if cheap;
    otherwise inspect the help-string declarations in the project
    source.

    Report met (with one short quote per top-level item plus a
    one-line confirmation that subcommands meet the bar, or noting
    the CLI has no subcommands) or unmet (listing the specific
    items missing — top-level gaps, flags without descriptions,
    or subcommands missing examples).
