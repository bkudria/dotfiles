required: false
description: If the CLI invokes a pager, it does so only when stdout is a TTY and respects the `$PAGER` environment variable.
notes: |
  Use a pager when emitting lots of text. Only invoke the pager
  when stdin or stdout is a TTY. Sensible default flags for
  `less` are `-FIRX`: `-F` quits if output fits on one screen,
  `-R` passes raw color codes through, `-X` disables alternate
  screen so paged content remains in the scrollback after exit,
  and `-I` makes searches case-insensitive (a comfort default).

  Trivially met if the CLI does not invoke a pager. Otherwise: the
  pager invocation must be gated on a TTY check for stdout, must respect
  `$PAGER` (treat empty `$PAGER` as "no pager", treat
  `PAGER=cat` as a no-op pass-through), and ideally pass
  TTY-friendly flags. The most common drift is paging
  unconditionally, which corrupts CI logs.

  Default severity is SUGG because most CLIs don't page at all.
  CLIs whose `--help` output or normal results are long enough to
  benefit from paging should pin to FAIL.
check:
  prompt: |
    Verify that if the CLI at $PROJECT_ROOT invokes a pager (less,
    more, $PAGER), it does so only when stdout is a TTY and
    respects `$PAGER`. Inspect source for shell-out invocations of
    `less`, `more`, `pager`, or environment-driven pager calls
    (`os/exec` with `$PAGER`, `subprocess` with `$PAGER`,
    language-native paging libraries). If no pager is invoked at
    all, report met with that fact. Otherwise verify: (1) the pager
    call is gated on a TTY check, (2) `$PAGER` is read and used
    (with empty `$PAGER` or `PAGER=cat` disabling/bypassing the
    pager), and (3) sensible flags are passed (commonly `less -FIRX`
    or equivalent — at minimum `-R` if color is preserved). Report
    met (with the call site and confirmation of each item) or
    unmet (with the specific gap — paging unconditionally,
    ignoring `$PAGER`, or using flags that swallow short output
    or strip color).
