required: false
description: Configuration precedence is documented (highest to lowest, e.g., flags > env > project config > user config > system).
notes: |
  The conventional precedence order is flags → shell env vars →
  project-level config → user-level config → system-wide config.
  When a CLI accepts the same setting from multiple layers, users
  need to know which layer wins.

  Trivially met for CLIs with only one config layer (just flags,
  or just a single config file). For CLIs with multiple layers,
  the precedence must be documented (in `--help`, the README, or
  a docs page) AND match the implementation. A documented
  deviation from the canonical order is acceptable as long as it
  is intentional and explained.

  Default severity is SUGG. CLIs with rich config schemes (deploy
  tools, build systems, package managers) should pin to FAIL —
  undocumented precedence is a debugging nightmare and a recurring
  user-support load.
check:
  prompt: |
    Verify that the CLI at $PROJECT_ROOT documents its configuration
    precedence. First detect how many config layers the CLI has —
    flags, env vars, project-level config files, user-level config
    files, system-wide config. If only one layer exists (e.g., just
    flags), report met with that fact. Otherwise, search the
    README, `--help` output, and `docs/` for an explicit ordering
    statement (table, ordered list, or prose). The standard meets
    if precedence is documented AND the documented ordering matches
    the implementation OR a deliberate deviation from the canonical
    order (flags > env > project > user > system) is explained. Report met (with the documentation location and
    the ordering observed) or unmet (with the layers detected and
    the absence of any precedence documentation).
