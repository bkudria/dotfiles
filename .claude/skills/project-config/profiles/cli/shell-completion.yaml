required: false
description: The CLI ships shell completion for at least bash and zsh.
notes: |
  Acceptable forms: a built-in subcommand that prints a completion
  script (e.g., `<cli> completion bash`) or static completion files
  installed by the package (e.g., share/bash-completion/,
  share/zsh/site-functions/). Document where users source or install
  the script.
check:
  prompt: |
    Verify that the CLI at $PROJECT_ROOT ships shell completion for at
    least bash and zsh. Look for either a built-in completion subcommand
    (search the codebase, --help output, or docs) or static completion
    files in conventional installation paths. Report met (with the
    mechanism — built-in subcommand or static files — and where it is
    documented) or unmet (with what was looked for and not found).
