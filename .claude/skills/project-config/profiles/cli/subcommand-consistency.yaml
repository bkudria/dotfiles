required: false
description: Subcommands share global flags consistently, have no confusable name pairs, and (for verb/noun command trees) maintain per-verb flag parity across noun targets.
notes: |
  Subcommands should be consistent across the CLI. Concretely: a
  global flag like `--quiet`, `--no-color`, `--json`, or `--config`
  should behave the same regardless of which subcommand it is
  passed under. Avoid confusable subcommand pairs (`update` vs
  `upgrade`, `info` vs `show`, `delete` vs `remove` with no
  documented difference) — they trap users.

  For CLIs with a verb/noun subcommand tree — those where the
  same verb (`get`, `list`, `delete`, `create`, etc.) applies
  across multiple noun targets — verb-parity is a third
  consistency axis. The same verb should accept the same
  per-verb flags with the same names and the same behaviour
  across all of its noun targets: `<cli> get pods
  --namespace=foo` and `<cli> get deployments --namespace=foo`
  should be structurally identical invocations. Drift here
  (e.g., `get pods` accepting `--namespace` but `get
  deployments` requiring `-n`) traps users who learned the
  verb on one noun and expect it to transfer to another.
  Trivially met for CLIs without a verb/noun tree (single-
  purpose tools, or CLIs whose subcommands are unique verbs
  without shared noun targets).

  Trivially met if the CLI has no subcommands. Otherwise the
  verifier inspects the subcommand tree (CLI library declaration
  or `<cli> --help`) and checks both axes: shared-flag parity
  (no `--quiet` here and `--silent` there) and absence of
  confusable noun/verb pairs.

  Default severity is SUGG because subcommand structure is a design
  decision; small CLIs frequently make local trade-offs. CLIs with
  larger surface areas (10+ subcommands) should pin to FAIL.
check:
  prompt: |
    Verify that the CLI at $PROJECT_ROOT, if it has subcommands,
    treats global flags consistently across them and avoids
    confusable subcommand names. Detect subcommands from the CLI
    library declarations or by running `<cli> --help` and parsing
    the COMMANDS section. For each global flag (e.g., `--quiet`,
    `--verbose`, `--no-color`, `--json`, `--config`, `--output`),
    confirm the name is consistent across subcommands (no `--quiet`
    here and `--silent` there) and that, where supported, behaves
    the same way. Scan the subcommand list for confusable pairs
    (e.g., `update`/`upgrade`, `list`/`show`, `delete`/`remove`
    with no documented difference).

    If the subcommand tree is verb/noun-shaped (the same verb
    appears across multiple noun targets — e.g., `get pods` and
    `get deployments`), additionally verify per-verb flag parity:
    each shared verb should accept the same flags with the same
    names and behaviour across all of its noun targets. If the
    tree is not verb/noun-shaped, this axis is trivially met.

    If the CLI has no subcommands, report met with that fact.
    Otherwise report met (with the subcommand count and a
    one-line summary of consistency across all applicable axes)
    or unmet (naming the inconsistencies — flag names that drift,
    confusable subcommand pairs, or per-verb flag drift across
    noun targets).
