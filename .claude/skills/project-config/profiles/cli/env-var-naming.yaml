required: false
description: Env vars the CLI reads use uppercase letters/digits/underscores and are prefixed by the program name.
notes: |
  Env var names should use uppercase letters, digits, and
  underscores only; they must not start with a digit. Avoid
  commandeering widely used names. Standard convention:
  `<APP>_<KEY>` or `<APP>_<MODULE>_<KEY>`. Examples:
  `KUBECONFIG`, `GH_TOKEN`, `DOCKER_HOST`, `CARGO_HOME`,
  `RUST_LOG`.

  Names like `password` (lowercase), `MyApp.Config` (mixed-case,
  punctuation), or `PATH` (commandeering POSIX) violate the rule.
  Honoring widely-used names without an app-specific prefix (e.g.,
  `NO_COLOR`, `EDITOR`, `HTTP_PROXY`) is fine — that's covered by
  `cli/general-env-vars`, not by this standard.

  Default severity is SUGG. CLIs with extensive env-driven config
  (12-factor-style apps, deploy tools, container runtimes) should
  pin to FAIL — naming drift across options is a common bug
  magnet.
check:
  prompt: |
    Verify that environment variables read by the CLI at
    $PROJECT_ROOT follow standard naming. Detect env-var reads
    — whatever language-native API the code uses for reading
    environment variables. For each name read by the CLI itself (excluding well-known generic
    names like `NO_COLOR`, `EDITOR`, `HOME`, `PATH`,
    `HTTP(S)_PROXY`, `TMPDIR`, `TERM`, `SHELL`, `PAGER`):
    (1) the name matches `^[A-Z_][A-Z0-9_]*$`,
    (2) the name is prefixed by an app-specific identifier (e.g.,
        `MYAPP_*`),
    (3) the name does not collide with POSIX-reserved or widely-
        established system variables.
    If the CLI reads no env vars, report met. Report met (with
    the prefix used and a one-line summary of the conformant
    inventory) or unmet (listing the names that violate the
    convention).
