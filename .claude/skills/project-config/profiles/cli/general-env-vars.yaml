required: false
description: The CLI honors widely-used env vars where applicable (`NO_COLOR`, `EDITOR`, `PAGER`, `HTTP(S)_PROXY`, `TMPDIR`, `TERM`).
notes: |
  Several cross-tool env vars are widely respected and should be
  honored when the CLI's functionality intersects with them.
  Concretely:
  - `NO_COLOR` if it emits color
  - `EDITOR` / `VISUAL` if it opens an editor
  - `PAGER` if it pages output
  - `HTTP_PROXY` / `HTTPS_PROXY` / `NO_PROXY` / `ALL_PROXY` if it
    makes HTTP calls
  - `TMPDIR` if it writes temp files
  - `TERM` / `TERM=dumb` for terminal capabilities
  - `HOME` for resolving user paths
  - `SHELL` if it spawns interactive shells

  This standard governs *which generic env vars the CLI should
  respect*, not how the CLI names its own env vars.

  Many of these are honored by libraries automatically (HTTP
  libraries usually honor proxy vars; modern color libraries
  usually honor `NO_COLOR`); library-level handling counts toward
  meeting the standard.

  Default severity is SUGG. The verifier matches each env var to
  the CLI's actual behavior — if the CLI never opens an editor,
  `EDITOR` is N/A and trivially met for that channel.
check:
  prompt: |
    Verify that the CLI at $PROJECT_ROOT honors widely-used env
    vars where applicable. For each variable, first determine
    whether it applies to this CLI's functionality, then whether
    the CLI reads it (directly or via a library that honors it):
    - `NO_COLOR` (applies if CLI emits color)
    - `EDITOR` / `VISUAL` (applies if CLI opens an editor for input)
    - `PAGER` (applies if CLI pages output)
    - `HTTP_PROXY` / `HTTPS_PROXY` / `NO_PROXY` / `ALL_PROXY`
      (applies if CLI does HTTP)
    - `TMPDIR` (applies if CLI writes temp files)
    - `TERM` (applies if CLI does terminal-aware output)
    - `HOME` (applies if CLI resolves paths under home)
    - `SHELL` (applies if CLI spawns interactive shells)
    Library-level honoring counts (e.g., HTTP clients usually
    respect proxy env vars by default; modern color libraries
    respect `NO_COLOR`). Report met (with a per-variable
    applicability + honors/inherits note) or unmet (listing the
    applicable variables the CLI ignores).
