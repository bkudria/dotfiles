required: true
description: CLAUDE.md or AGENTS.md references the project's Allium specification.
notes: |
  Verifies that the agent-facing notes file mentions the Allium spec —
  by file extension (`.allium`) or as the standalone word "allium". The
  AI-collaborator analogue of readme-reference: without a pointer in
  CLAUDE.md or AGENTS.md, agents working in the project will not know
  the spec exists or that it is the authoritative source of behavioural
  truth. Accepts CLAUDE.md or AGENTS.md (first match wins, matching
  base/claude-md). Match is case-insensitive.
check:
  script: |
    cd "$PROJECT_ROOT"
    found=""
    for f in CLAUDE.md AGENTS.md; do
      [[ -e "$f" ]] && { found="$f"; break; }
    done
    if [[ -z "$found" ]]; then
      echo "No CLAUDE.md or AGENTS.md file found"
      exit 1
    fi
    if grep -qiE '\.allium|\ballium\b' "$found"; then
      echo "$found references the Allium spec"
      exit 0
    fi
    echo "$found exists but does not reference the Allium spec"
    exit 1
