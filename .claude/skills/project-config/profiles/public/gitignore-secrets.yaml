required: true
description: .gitignore excludes common secret-bearing files (e.g., .env).
notes: |
  Public repositories that don't ignore .env risk exposing secrets when
  contributors accidentally commit them. This is a public-only standard
  because private repos still benefit from .env exclusion but the risk
  profile is different.
check:
  script: |
    cd "$PROJECT_ROOT"
    if [[ ! -e .gitignore ]]; then
      echo "No .gitignore found (cannot verify secret-pattern coverage)"
      exit 1
    fi
    missing=""
    for pattern in ".env"; do
      if ! grep -q "$pattern" .gitignore; then
        missing="${missing:+$missing, }$pattern"
      fi
    done
    if [[ -n "$missing" ]]; then
      echo ".gitignore is missing secret-bearing patterns: $missing"
      exit 1
    fi
    echo ".gitignore covers expected secret-bearing patterns"
    exit 0
