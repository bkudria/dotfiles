required: true
description: Contributor-facing docs explain how releases are cut end-to-end, including any one-time bootstrap.
notes: |
  Distinct from release-automation, which only checks that a tool is
  configured. This standard verifies that the PROCESS — commit
  conventions, release-PR creation, version bumps, artifact publish,
  CHANGELOG updates, and any one-time bootstrap — is documented
  somewhere a contributor can find.

  Bootstrap concerns are called out separately because they are easy
  to omit: an automated release flow may require a one-time human
  action (placeholder publish to claim a registry name, trusted-
  publisher handshake, repo setting to enable Actions PR creation,
  etc.) that the steady-state docs do not describe. Future maintainers
  re-derive these by trial and error if they aren't written down.
check:
  prompt: |
    Verify that the project at $PROJECT_ROOT documents how a release is
    cut end-to-end. Inspect CONTRIBUTING.md, RELEASING.md (if it
    exists), docs/ release pages, and any inline release-process notes.

    The STEADY-STATE process should explain: commit-message conventions,
    who or what creates the release PR, how versions are bumped, how
    the artifact is published, and how CHANGELOG entries appear.

    Additionally, if the release flow requires a one-time BOOTSTRAP
    (e.g., a placeholder artifact published to claim a name on a
    registry, a trusted-publisher handshake performed out-of-band, a
    repo setting that must be enabled before the automation can open
    PRs, or any other action that cannot be run from the normal
    automated pipeline), that bootstrap MUST be documented as a
    separate, mechanically-executable runbook — not folded into the
    steady-state process. If the project has no such bootstrap
    requirement, that's also acceptable.

    Report met (with the doc location, a one-line summary of the
    steady-state flow, and whether bootstrap concerns are addressed
    where applicable) or unmet (with the gaps).
