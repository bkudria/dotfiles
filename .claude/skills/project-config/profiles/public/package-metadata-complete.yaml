required: true
description: The project's manifest fills in discoverability/governance fields
  beyond the bare minimum.
notes: |
  Distinct from package-metadata, which only checks the BASIC fields.
  This standard verifies discoverability/governance metadata for the
  fields the manifest format natively supports: keywords or topics,
  author/maintainer, bugs URL, homepage URL. Manifest formats vary in
  what they expose — Ruby gemspecs have no native keywords field;
  npm/Cargo/pyproject do; etc. The standard is met when every applicable
  field is populated. Fields the ecosystem does not natively support are
  out of scope — skipped, not failed. The check is manifest-only:
  GitHub repo topics, README badges, and other non-manifest signals do
  NOT substitute for an absent manifest field.
check:
  prompt: |
    Verify that the project at $PROJECT_ROOT fills in the
    discoverability/governance fields its manifest format natively
    supports. Determine the manifest format from the project root. From
    the candidate field set — keywords/topics, author/maintainer, bugs
    URL, homepage URL — identify which are first-class fields in that
    manifest format (e.g., Ruby gemspec lacks a native `keywords` field;
    npm/Cargo/pyproject have one; most formats expose author, bugs URL,
    and homepage URL). Treat fields the format does not natively expose
    as out of scope — do NOT penalise them, and do NOT accept GitHub
    repo topics, README badges, or other non-manifest signals as
    substitutes. The standard is met when every applicable field is
    populated. Report met (with the manifest path, the applicable field
    list, and confirmation each is populated) or unmet (with the
    manifest path, the applicable field list, and which applicable
    fields are missing or placeholder).
