required: true
description: A PR/MR template exists in the conventional GitHub or GitLab location.
notes: |
  Looks for the canonical single-file form at .github/PULL_REQUEST_TEMPLATE.md
  (case variants and root/docs locations also accepted), the multi-template
  directory .github/PULL_REQUEST_TEMPLATE/, or GitLab's
  .gitlab/merge_request_templates/.
check:
  script: |
    cd "$PROJECT_ROOT"
    for f in .github/PULL_REQUEST_TEMPLATE.md .github/pull_request_template.md \
             PULL_REQUEST_TEMPLATE.md docs/PULL_REQUEST_TEMPLATE.md; do
      if [[ -e "$f" && -s "$f" ]]; then
        echo "$f exists"
        exit 0
      fi
    done
    if [[ -d .github/PULL_REQUEST_TEMPLATE ]]; then
      count=$(find .github/PULL_REQUEST_TEMPLATE -maxdepth 1 -type f -name '*.md' 2>/dev/null | wc -l | tr -d ' ')
      if [[ "$count" -gt 0 ]]; then
        echo ".github/PULL_REQUEST_TEMPLATE/ has $count templates"
        exit 0
      fi
    fi
    if [[ -d .gitlab/merge_request_templates ]]; then
      count=$(find .gitlab/merge_request_templates -maxdepth 1 -type f -name '*.md' 2>/dev/null | wc -l | tr -d ' ')
      if [[ "$count" -gt 0 ]]; then
        echo ".gitlab/merge_request_templates/ has $count templates"
        exit 0
      fi
    fi
    echo "No PR template found"
    exit 1
