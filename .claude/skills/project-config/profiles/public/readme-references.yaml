required: false
description: README references the standard governance/contributor docs.
notes: |
  Verifies the README links to GOALS.md, a spec document, CONTRIBUTING.md,
  CODE_OF_CONDUCT.md, SECURITY.md, SUPPORT.md, and CHANGELOG.md. The
  README is the on-ramp; if those docs aren't linked, contributors
  won't find them. The check is required: false because a thoughtfully
  curated README may legitimately omit some references.

  The SPEC reference accepts the same alias set as the base/spec
  standard: SPEC.md, specification.md, design.md, or any *.allium
  file. Other prose-spec extensions (.rst, .adoc, .org, .txt) are
  matched only when the filename root is "spec", "specification",
  or "design" so that arbitrary prose docs aren't false positives.
check:
  script: |
    cd "$PROJECT_ROOT"
    found=""
    for f in README.md README README.txt README.rdoc README.org; do
      [[ -e "$f" ]] && { found="$f"; break; }
    done
    if [[ -z "$found" ]]; then
      echo "No README file found"
      exit 1
    fi
    # Spec reference accepts multiple aliases (mirrors base/spec).
    spec_pattern='SPEC\.md|specification\.md|design\.md|\.allium|(SPEC|specification|design)\.(rst|adoc|org|txt)'
    missing=""
    for ref in GOALS.md SPEC.md CONTRIBUTING.md CODE_OF_CONDUCT.md SECURITY.md SUPPORT.md CHANGELOG.md; do
      if [[ "$ref" == "SPEC.md" ]]; then
        if ! grep -qiE "$spec_pattern" "$found"; then
          missing="${missing:+$missing, }$ref"
        fi
      else
        if ! grep -qi "$ref" "$found"; then
          missing="${missing:+$missing, }$ref"
        fi
      fi
    done
    if [[ -n "$missing" ]]; then
      echo "$found exists but missing references: $missing"
      exit 1
    fi
    echo "$found references all standard docs"
    exit 0
